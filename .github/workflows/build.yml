name: Build image

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and first-boot test
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Free runner disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/share/swift
          sudo apt-get clean
          df -h /

      - name: Install QEMU and UEFI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cloud-image-utils \
            ovmf \
            qemu-system-x86 \
            qemu-utils \
            xorriso

          if [ ! -e /dev/kvm ]; then
            echo "::error title=KVM unavailable::/dev/kvm is not available on this runner"
            exit 1
          fi
          sudo chmod 666 /dev/kvm

          set +e
          timeout 5 qemu-system-x86_64 \
            -accel kvm \
            -machine q35 \
            -cpu host \
            -m 128 \
            -S \
            -display none \
            -nodefaults \
            -monitor none \
            -serial none >/tmp/kvm-preflight.log 2>&1
          kvm_status=$?
          set -e
          if [ "$kvm_status" -ne 124 ]; then
            cat /tmp/kvm-preflight.log
            kvm_message="$(tr '\n' ' ' </tmp/kvm-preflight.log | cut -c1-1500)"
            echo "::error title=KVM preflight failed::QEMU could not use KVM acceleration (exit $kvm_status): ${kvm_message}"
            exit 1
          fi

      - name: Set up Packer
        uses: hashicorp/setup-packer@v3
        with:
          version: "1.16.2"

      - name: Build image
        run: |
          set -o pipefail
          make build 2>&1 | tee build.log

      - name: First-boot test
        run: |
          set -o pipefail
          make test-qemu 2>&1 | tee test.log

      - name: Upload image artifacts
        uses: actions/upload-artifact@v7
        with:
          name: al10-base-image
          path: |
            dist/*.qcow2
            dist/*.sha256
            dist/*.json
            dist/*.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload build and guest logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-logs
          path: |
            build.log
            test.log
            .build/console.log
            .build/test/console.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Annotate failure
        if: failure()
        run: scripts/ci-annotate-logs.sh build.log test.log .build/console.log .build/test/console.log

      - name: Publish success annotation
        if: success()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("dist/build-manifest.json").read_text())
          print(
              "::notice title=AL10 base image built::"
              f"Version {manifest['version']}; SHA256 {manifest['artifact_sha256']}; "
              f"{manifest['artifact_size_bytes']} bytes"
          )
          PY

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## AL10 base image"
            echo ""
            if [ -f dist/build-manifest.json ]; then
              python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("dist/build-manifest.json").read_text())
          print(f"- **Version:** `{manifest['version']}`")
          print(f"- **Artifact:** `{manifest['artifact']}`")
          print(f"- **SHA256:** `{manifest['artifact_sha256']}`")
          print(f"- **Size:** {manifest['artifact_size_bytes']} bytes")
          print(f"- **Base image:** `{manifest['base_image_url']}`")
          print(f"- **Build commit:** `{manifest['git_sha']}`")
          PY
            else
              echo "No build manifest produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
